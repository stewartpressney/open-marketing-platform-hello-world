name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push makes an in-flight run irrelevant, so don't spend runners on it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Vite reads these at build time. They are placeholders — the build only
      # needs the variables to exist, and nothing here talks to Supabase.
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key

  functions:
    name: Typecheck Edge Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # The functions are never exercised by the client build, so without this
      # they would reach production entirely unchecked.
      - name: Typecheck
        run: deno check supabase/functions/*/index.ts
